<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070815" />
      <stop offset="50%" stop-color="#0b1026" />
      <stop offset="100%" stop-color="#080b18" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64ffda" />
      <stop offset="50%" stop-color="#76b900" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64ffda" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64ffda" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1200" height="380" rx="20" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="950" cy="190" r="190" fill="#64ffda" opacity="0.06" filter="url(#glow)" />
  <circle cx="250" cy="80" r="150" fill="#76b900" opacity="0.05" filter="url(#glow)" />

  <!-- Top Brand Pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="470" height="34" rx="17" fill="#0f172a" stroke="#64ffda" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="5" fill="#76b900" />
    <text x="36" y="22" font-family="'Fira Code', monospace" font-size="12.5" font-weight="600" fill="#64ffda" letter-spacing="1.2">RANUK IT SOLUTIONS · POWERED BY NVIDIA PERSONAPLEX 7B</text>
  </g>

  <!-- Main Heading -->
  <text x="60" y="138" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">RANUK VOICE CLOSER</text>
  <text x="60" y="182" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">Full-Duplex AI Voice Receptionist &amp; Inbound Sales Closer (EN &amp; ES)</text>

  <!-- Subtitle Description -->
  <text x="60" y="224" font-family="'Inter', -apple-system, sans-serif" font-size="15.5" fill="#cbd5e1">
    100% End-to-End Speech-to-Speech powered by NVIDIA PersonaPlex (`nvidia/personaplex-7b-v1` / `moshi`)
  </text>
  <text x="60" y="248" font-family="'Inter', -apple-system, sans-serif" font-size="15.5" fill="#cbd5e1">
    with 18 native voice embeddings (`NATF0..3`, `NATM0..3`, `VARF0..4`, `VARM0..4`) &amp; `<system>` role conditioning.
  </text>

  <!-- Metric Badges -->
  <g transform="translate(60, 282)">
    <rect x="0" y="0" width="205" height="54" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <text x="18" y="24" font-family="'Fira Code', monospace" font-size="15.5" font-weight="700" fill="#76b900">personaplex-7b-v1</text>
    <text x="18" y="43" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Moshi Full-Duplex Architecture</text>

    <rect x="220" y="0" width="205" height="54" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <text x="238" y="24" font-family="'Fira Code', monospace" font-size="15.5" font-weight="700" fill="#64ffda">18 Voice Embeddings</text>
    <text x="238" y="43" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">NATF0-3 · NATM0-3 · VARF/M0-4</text>

    <rect x="440" y="0" width="185" height="54" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <text x="458" y="24" font-family="'Fira Code', monospace" font-size="15.5" font-weight="700" fill="#38bdf8">&lt;system&gt; Prompts</text>
    <text x="458" y="43" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Bilingual ES &amp; EN Roles</text>

    <rect x="640" y="0" width="185" height="54" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <text x="658" y="24" font-family="'Fira Code', monospace" font-size="15.5" font-weight="700" fill="#a855f7">Stripe + Cal.com</text>
    <text x="658" y="43" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Instant Deal Handoff</text>
  </g>

  <!-- Right Side Audio Waveform Card -->
  <g transform="translate(865, 58)">
    <rect x="0" y="0" width="280" height="264" rx="18" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="30" cy="30" r="6" fill="#76b900" />
    <text x="46" y="34" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#e2e8f0">MOSHI FULL-DUPLEX STREAM</text>
    <rect x="215" y="18" width="46" height="22" rx="6" fill="#1e293b" />
    <text x="224" y="33" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#64ffda">ES/EN</text>

    <!-- Waveform Bars -->
    <g transform="translate(28, 115)">
      <rect x="0" y="-18" width="6" height="36" rx="3" fill="#64ffda" />
      <rect x="14" y="-34" width="6" height="68" rx="3" fill="#64ffda" />
      <rect x="28" y="-48" width="6" height="96" rx="3" fill="#76b900" />
      <rect x="42" y="-26" width="6" height="52" rx="3" fill="#38bdf8" />
      <rect x="56" y="-56" width="6" height="112" rx="3" fill="#64ffda" />
      <rect x="70" y="-40" width="6" height="80" rx="3" fill="#76b900" />
      <rect x="84" y="-20" width="6" height="40" rx="3" fill="#64ffda" />
      <rect x="98" y="-44" width="6" height="88" rx="3" fill="#76b900" />
      <rect x="112" y="-60" width="6" height="120" rx="3" fill="#64ffda" />
      <rect x="126" y="-36" width="6" height="72" rx="3" fill="#38bdf8" />
      <rect x="140" y="-50" width="6" height="100" rx="3" fill="#64ffda" />
      <rect x="154" y="-28" width="6" height="56" rx="3" fill="#76b900" />
      <rect x="168" y="-42" width="6" height="84" rx="3" fill="#38bdf8" />
      <rect x="182" y="-30" width="6" height="60" rx="3" fill="#64ffda" />
      <rect x="196" y="-16" width="6" height="32" rx="3" fill="#38bdf8" />
      <rect x="210" y="-24" width="6" height="48" rx="3" fill="#64ffda" />
    </g>

    <rect x="20" y="192" width="240" height="52" rx="10" fill="#1e293b" />
    <text x="34" y="213" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#64ffda">PersonaPlex 7B (Voice: NATF2):</text>
    <text x="34" y="231" font-family="'Inter', sans-serif" font-size="11" fill="#e2e8f0">"Detectamos 14 fallos WCAG AA..."</text>
  </g>
</svg>

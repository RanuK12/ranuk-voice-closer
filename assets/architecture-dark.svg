    <rect x="20" y="72" width="205" height="82" rx="10" fill="#111827" stroke="#1e293b" />
    <text x="34" y="98" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64ffda">ADA / WCAG Audit Close</text>
    <text x="34" y="118" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">$290 Remediation Checkout</text>
    <text x="34" y="138" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">audit.ranuk.dev/checkout</text>

    <rect x="20" y="170" width="205" height="82" rx="10" fill="#111827" stroke="#1e293b" />
    <text x="34" y="196" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Enterprise SDR Booking</text>
    <text x="34" y="216" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">Live Discovery Call Link</text>
    <text x="34" y="236" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">ranuk.dev/#contact</text>

    <rect x="20" y="268" width="205" height="72" rx="10" fill="#111827" stroke="#1e293b" />
    <text x="34" y="294" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#76b900">Webhook &amp; WAV Output</text>
    <text x="34" y="314" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">24kHz WAV + JSON Transcript</text>
    <text x="34" y="330" font-family="'Fira Code', monospace" font-size="11" fill="#22c55e">+ Intent Score (0-100)</text>
  </g>
</svg>
